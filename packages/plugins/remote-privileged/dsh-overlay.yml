# dsh-station 的壳级常驻 overlay，由 launcher 以 `dsh --patch <这个文件>` 传给 dsh，
# 固定在 overlay 列表首位。它是全部插件 RPC 通道的地基，与远程无关，
# 本机使用同样需要，因此不可停用；ownsHost 的远程设置部分在
# remote-settings 受管 Bundle 里。
#
# profile 属于用户，launcher 只在 profile 不存在时写模板，因此不能改用户的
# cordis.patch.yml；`--patch` 在 profile 层之后应用（`apps/cli/src/args.ts`）。
# connection 注入 webRuntime 与 webServer，让 RPC 注册使用相同的 WebServer context。
- id: connection
  inject: [webRuntime, webServer]

# 启动屏障保持为进程级固定契约，避免运行中停用模型增强时热重启 llm-pi-ai。
- id: llm-pi-ai
  name: '@deepseek-ai/dsh-llm-pi-ai'
  inject:
    - llm
    - modelsCatalogBootstrap
    - modelCapabilitiesBootstrap

- insert:
    - id: dsh-station-model-bootstrap-fallback
      name: './model-bootstrap.mjs'
    - id: dsh-station-theme-projection
      name: './theme-projection.mjs'
